<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1124">
<title>حِصْنُ المُسْلِمِ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=IBM+Plex+Sans+Arabic:wght@500;600&display=swap" rel="stylesheet">
<style>
@property --t{syntax:'<color>';inherits:true;initial-value:#0a1124}
@property --b{syntax:'<color>';inherits:true;initial-value:#1d2c52}
@property --ac{syntax:'<color>';inherits:true;initial-value:#e8cc8e}
@property --cl{syntax:'<color>';inherits:true;initial-value:#8fa3cc}
@property --co{syntax:'<number>';inherits:true;initial-value:.22}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{--t:#0a1124;--b:#1d2c52;--ac:#e8cc8e;--cl:#8fa3cc;--co:.22;--ink:#fff8e8;--mut:#d3d9e0;--card:rgba(8,14,28,.5);--line:rgba(255,248,232,.26);
  font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink);height:100dvh;overflow:hidden;
  background:linear-gradient(180deg,var(--t) 0%,color-mix(in srgb,var(--t) 55%,var(--b)) 58%,var(--b) 100%);
  transition:--t 4s,--b 4s,--ac 4s,--cl 4s,--co 4s}
body[data-p=fajr]{--t:#1b2150;--b:#b5718c;--ac:#f7d0a8;--cl:#ffd6d0;--co:.6}
body[data-p=morning]{--t:#1a4a63;--b:#e4b27a;--ac:#fbe7b0;--cl:#fff1dc;--co:.8}
body[data-p=day]{--t:#134468;--b:#5aa7c9;--ac:#fff0b8;--cl:#fff;--co:.9}
body[data-p=asr]{--t:#2a3a5e;--b:#d9904f;--ac:#ffd18a;--cl:#ffe6c4;--co:.75}
body[data-p=maghrib]{--t:#2b1648;--b:#e0654a;--ac:#ffbf80;--cl:#ffb199;--co:.7}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:3px;border-radius:24px}

/* ===== السماء ===== */
.bg,.cel{position:fixed;pointer-events:none}
.bg{inset:0}
#stars{opacity:0;transition:opacity 3s}
body[data-p=night] #stars{opacity:1}body[data-p=fajr] #stars,body[data-p=maghrib] #stars{opacity:.35}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.15}to{opacity:.95}}
.shoot{position:absolute;top:10%;right:25%;width:90px;height:2px;background:linear-gradient(90deg,#fff,transparent);opacity:0;animation:shoot 26s linear infinite}
@keyframes shoot{0%,93%{opacity:0;transform:translate(0,0) rotate(-35deg)}94%{opacity:1}100%{opacity:0;transform:translate(-240px,160px) rotate(-35deg)}}

.cel{left:0;top:0;opacity:0;border-radius:50%;will-change:transform,opacity;
  transform:translate(calc(var(--x,50) * 1vw - 50%),calc(var(--y,30) * 1dvh - 50%)) scale(var(--s,1));transition:transform 1s linear,opacity 2s}
/* الشمس: قرص ساطع مع تدرّج حافة، وهج متعدد الطبقات، وأشعة ناعمة غير منتظمة */
#sun{width:clamp(76px,20vw,110px);aspect-ratio:1;
  background:radial-gradient(circle,#fffbe6 0,#ffec9a 35%,#ffcf45 72%,color-mix(in srgb,var(--ac) 40%,#ff9d1c) 100%);
  box-shadow:0 0 0 2px color-mix(in srgb,#ffb21c 55%,transparent),0 0 24px 8px color-mix(in srgb,#ffd24a 75%,transparent),0 0 70px 28px color-mix(in srgb,var(--ac) 50%,transparent),0 0 150px 60px color-mix(in srgb,var(--ac) 20%,transparent);
  filter:hue-rotate(calc(var(--hz,0) * -12deg)) saturate(calc(1 + var(--hz,0) * .35))}
#sun::after{content:'';position:absolute;inset:-115%;border-radius:50%;filter:blur(2.5px);
  background:repeating-conic-gradient(color-mix(in srgb,var(--ac) 40%,transparent) 0 1.2deg,transparent 1.2deg 9deg),repeating-conic-gradient(from 3deg,color-mix(in srgb,#fff 35%,transparent) 0 .7deg,transparent .7deg 14deg);
  -webkit-mask:radial-gradient(circle,#000 18%,transparent 66%);mask:radial-gradient(circle,#000 18%,transparent 66%);animation:spin 140s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* القمر: سطح بفوهات وبحار، يتغير طوره حسب التاريخ الهجري */
#moon{width:clamp(58px,15vw,80px);aspect-ratio:1;filter:sepia(calc(var(--hz,0) * .4)) saturate(calc(1 + var(--hz,0) * .5))}
#moon svg{display:block;width:100%;height:100%;overflow:visible}
/* السحب: سحب SVG مُجسَّمة بطبقات ظل وضوء وحواف مبعثرة */
#clouds .cloud{position:absolute;left:0;top:var(--y);width:var(--w);height:auto;aspect-ratio:5/2;overflow:visible;
  opacity:min(1,calc(var(--o) * var(--co) * var(--cc,1)));filter:brightness(var(--cb,1));transition:opacity 3s;animation:drift calc(var(--d) / var(--wm,1)) linear infinite;animation-delay:var(--dl);will-change:transform}
@keyframes drift{from{transform:translateX(-45vw)}to{transform:translateX(110vw)}}

/* الطيور: سرب صغير يعبر السماء نهارًا بين فترة وأخرى */
#birds{transition:opacity 3s}
body[data-p=night] #birds{opacity:0}body[data-p=fajr] #birds,body[data-p=maghrib] #birds{opacity:.6}
.flock{position:absolute;left:0;top:var(--y);width:0;height:0;opacity:0;animation:var(--k) var(--d) linear infinite;animation-delay:var(--dl)}
.flock svg{position:absolute;overflow:visible}
@keyframes fly{0%{transform:translate(-12vw,0);opacity:0}2%,26%{opacity:1}28%,100%{transform:translate(112vw,-9vh);opacity:0}}
@keyframes flyr{0%{transform:translate(112vw,0);opacity:0}2%,26%{opacity:1}28%,100%{transform:translate(-12vw,-7vh);opacity:0}}

/* ===== الواجهة ===== */
.app{position:relative;z-index:1;height:100%;width:min(100%,620px);margin:auto;display:flex;flex-direction:column;justify-content:space-between;gap:12px;
  padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(14px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:1.05rem;color:var(--ink);text-shadow:0 1px 10px rgba(0,0,0,.5)}
.top{position:relative;z-index:6}
.dbtn{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);color:inherit;font:inherit;font-size:.95rem;text-shadow:inherit;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.dbtn:active,.cd:active{transform:scale(.97)}
.chev{font-style:normal;font-size:.8em;opacity:.8;transition:transform .2s}
[aria-expanded=true]>.chev{transform:rotate(180deg)}
.cd{cursor:pointer}
.pop{position:absolute;top:calc(100% + 8px);min-width:210px;padding:8px 16px;border-radius:18px;background:var(--card);border:1.5px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);animation:in .25s ease}
#dpop{inset-inline-start:0}#ppop{inset-inline-end:0}
.pop .row{display:flex;justify-content:space-between;gap:18px;padding:5px 0;font-size:.98rem}
.pop .row+.row{border-top:1px solid var(--line)}
.pop .row span:first-child{color:var(--mut)}
.pop .row.on,.pop .row.on span:first-child{color:var(--ac);font-weight:600}
.cd{padding:6px 16px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);text-align:center;line-height:1.35}
.cd span{font-size:.92rem;color:var(--mut)}
.cd b{display:block;font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr}
/* لمسات جمالية */
.dbtn,.cd,.pop,.big{box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 24px rgba(0,0,0,.18)}
.cd{position:relative}
.cd::before,.cd::after{content:'';position:absolute;inset-inline-start:14px;bottom:4px;height:2px;border-radius:2px}
.cd::before{width:calc(100% - 28px);background:var(--line)}
.cd::after{width:calc((100% - 28px) * var(--pg,0));background:var(--ac);box-shadow:0 0 6px var(--ac);transition:width 1s linear}
.pop{max-width:88vw;min-width:240px;padding-bottom:10px}.pop .row span:first-child{white-space:nowrap}.pop .row span:last-child{text-align:end}
.pop i{display:inline-block;font-size:.85em;line-height:1;font-style:normal;color:var(--ac);transition:transform .3s}
.dunes{position:fixed;left:0;right:0;bottom:0;width:100%;height:26dvh;z-index:0;pointer-events:none}
/* الطقس الواقعي */
#wxsky{position:fixed;inset:0;pointer-events:none;background:linear-gradient(#56626e,#8a949e 70%,#9aa3ab);opacity:var(--wo,0);transition:opacity 4s}
#wxfog{position:fixed;top:0;bottom:0;left:-8%;right:-8%;pointer-events:none;opacity:var(--wf,0);transition:opacity 4s;animation:fogd 45s ease-in-out infinite alternate;
  background:radial-gradient(ellipse 60% 22% at 30% 72%,rgba(228,233,238,.8),transparent 70%),radial-gradient(ellipse 60% 25% at 72% 52%,rgba(228,233,238,.65),transparent 70%),linear-gradient(rgba(215,222,228,.3),rgba(215,222,228,.5))}
@keyframes fogd{to{transform:translateX(5%)}}
#wxfx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#wxflash{position:fixed;inset:0;pointer-events:none;background:#dfe8ff;opacity:0}
@keyframes flash{0%,100%{opacity:0}8%{opacity:.7}16%{opacity:.08}26%{opacity:.5}55%{opacity:0}}
#wx{position:fixed;top:68px;left:50%;transform:translateX(-50%);z-index:5;padding:5px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:.78rem;white-space:nowrap;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);pointer-events:none}
body[data-wx=rain] #birds,body[data-wx=storm] #birds,body[data-wx=snow] #birds,body[data-wx=fog] #birds{opacity:0!important}
.grove .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway var(--sd,4s) ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(calc(var(--sa,.6deg) * -1))}to{transform:rotate(var(--sa,.6deg))}}
/* زرّا التاريخ والصلاة: نفس الحجم والارتفاع للتناسق */
.dbtn,.cd{flex:1 1 0;min-width:0;height:44px;box-sizing:border-box;padding:0 10px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;font-size:clamp(.66rem,3.1vw,.92rem);line-height:1}
.cd{flex-direction:row;gap:5px}
.cd span{font-size:inherit;color:var(--mut)}
.cd b{display:inline;font-size:inherit;font-weight:600}
#hijri,.cd span{overflow:hidden;text-overflow:ellipsis}
@media(max-width:380px){.dbtn,.cd{padding:0 6px;gap:3px;font-size:.64rem}.dbtn{gap:5px}}

.info{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px}
.why{padding:5px 16px;border-radius:99px;background:rgba(8,14,28,.5);color:var(--ac);font-size:1.05rem;line-height:1.5;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.why::before{content:'۞ ';font-family:'Amiri',serif}
.title{font-family:'Amiri',serif;font-size:clamp(2rem,9.5vw,3rem);line-height:1.3;font-weight:700;text-shadow:0 2px 24px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.4)}
.title.swap{animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.hint{font-size:1.1rem;color:var(--ink);min-height:1.5em;text-shadow:0 1px 10px rgba(0,0,0,.55)}

.ctl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.big{flex:none;display:grid;place-items:center;border-radius:50%;background:var(--card);border:1.5px solid var(--line);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  width:clamp(64px,19vw,88px);height:clamp(64px,19vw,88px);transition:transform .12s,background .2s}
.big:active{transform:scale(.9);background:rgba(255,255,255,.2)}
.big svg{width:44%;height:44%;fill:currentColor}
.orb{position:relative;flex:none;width:clamp(150px,46vw,220px);aspect-ratio:1}
.orb .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-linecap:round}
.ring .tr{stroke:var(--line);stroke-width:2.5}
.ring .pr{stroke:var(--ac);stroke-width:3.5;stroke-dasharray:301.6;stroke-dashoffset:301.6;transition:stroke-dashoffset .3s linear;filter:drop-shadow(0 0 4px var(--ac))}
.halo{position:absolute;inset:9%;border-radius:50%;border:2px solid var(--ac);opacity:0}
.playing .halo{animation:halo 3.6s ease-out infinite}.playing .halo+.halo{animation-delay:1.8s}
@keyframes halo{from{opacity:.55;transform:scale(1)}to{opacity:0;transform:scale(1.55)}}
.play{position:absolute;inset:9%;border-radius:50%;display:grid;place-items:center;color:#1a1408;
  background:radial-gradient(circle at 36% 30%,#fff,var(--ac) 62%,color-mix(in srgb,var(--ac) 70%,#5a3500));
  box-shadow:0 14px 34px rgba(0,0,0,.35);transition:transform .12s}
.play:active{transform:scale(.94)}
.play svg{width:38%;height:38%;fill:currentColor}
.play .i2,.playing .play .i1{display:none}.playing .play .i2{display:block}
.time{margin-top:10px;text-align:center;font-size:1rem;direction:ltr;font-variant-numeric:tabular-nums;text-shadow:0 1px 10px rgba(0,0,0,.55)}

.cat{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:5px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.cat::before{content:'';position:absolute;top:5px;bottom:5px;inset-inline-start:5px;width:calc((100% - 10px)/3);border-radius:99px;
  background:var(--ac);transform:translateX(calc(var(--i,0) * -100%));transition:transform .35s cubic-bezier(.3,.8,.3,1)}
.cat button{position:relative;min-height:60px;border-radius:99px;font-size:1.3rem;font-weight:600;transition:color .3s}
.cat button.on{color:#1a1408}

@media (orientation:landscape) and (max-height:540px){
  .app{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto;width:100%;column-gap:28px}
  .top{grid-column:1/3}.info{grid-column:1}.ctl-wrap{grid-column:2;grid-row:2;align-self:center}.cat{grid-column:1/3}
  .title{font-size:2.4rem}.orb{width:150px}.big{width:70px;height:70px}.cat button{min-height:50px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-p="night">
<div class="bg" id="stars" aria-hidden="true"><span class="shoot"></span></div>
<div id="wxsky" aria-hidden="true"></div><div id="wxfog" aria-hidden="true"></div>
<div class="cel" id="sun" aria-hidden="true"></div>
<div class="cel" id="moon" aria-hidden="true"><svg viewBox="0 0 100 100"><defs>
<radialGradient id="mh"><stop offset="0" stop-color="#dfe8ff" stop-opacity=".5"/><stop offset=".35" stop-color="#b8c8f0" stop-opacity=".16"/><stop offset="1" stop-color="#b8c8f0" stop-opacity="0"/></radialGradient>
<radialGradient id="mb" cx=".42" cy=".4" r=".65"><stop offset="0" stop-color="#f6f3ea"/><stop offset=".7" stop-color="#e2ded1"/><stop offset="1" stop-color="#aaa79d"/></radialGradient>
<radialGradient id="ms"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".42"/></radialGradient>
<clipPath id="md"><circle cx="50" cy="50" r="47"/></clipPath>
<filter id="mbl"><feGaussianBlur stdDeviation="1.2"/></filter>
<filter id="mm" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.3"/></filter>
<filter id="mg"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="5"/><feColorMatrix values="0 0 0 0 .35 0 0 0 0 .35 0 0 0 0 .38 0 0 0 .9 -.25"/></filter>
<mask id="ml" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><path id="mp" fill="#fff" filter="url(#mbl)"/></mask>
<g id="mt"><circle cx="50" cy="50" r="47" fill="url(#mb)"/>
<g fill="#7b7875" opacity=".55" filter="url(#mm)"><ellipse cx="40" cy="33" rx="11" ry="9"/><circle cx="56" cy="34" r="6.5"/><ellipse cx="63" cy="46" rx="9" ry="7"/><ellipse cx="77" cy="38" rx="4.5" ry="3.5"/><ellipse cx="24" cy="48" rx="8" ry="14"/><ellipse cx="42" cy="66" rx="8" ry="5.5"/><circle cx="28" cy="66" r="4"/><ellipse cx="72" cy="58" rx="5" ry="6"/></g>
<g fill="#000" fill-opacity=".07" stroke="#fff" stroke-opacity=".3" stroke-width=".5"><circle cx="36" cy="47" r="2.4"/><circle cx="30" cy="38" r="1.8"/><circle cx="58" cy="62" r="3"/><circle cx="70" cy="72" r="2.2"/><circle cx="50" cy="52" r="1.6"/><circle cx="82" cy="52" r="2"/><circle cx="22" cy="70" r="2.6"/><circle cx="62" cy="80" r="2"/><circle cx="35" cy="78" r="1.7"/></g>
<g stroke="#fff" stroke-opacity=".28" stroke-width=".5"><path d="M45 84L20 94M45 84L60 97M45 84L38 62M45 84L70 74"/></g><circle cx="45" cy="84" r="2.3" fill="#fff"/>
<rect width="100" height="100" filter="url(#mg)" opacity=".22"/><circle cx="50" cy="50" r="47" fill="url(#ms)"/></g></defs>
<circle id="mhalo" cx="50" cy="50" r="90" fill="url(#mh)"/>
<g clip-path="url(#md)"><circle cx="50" cy="50" r="47" fill="#0b1226" opacity=".4"/><use href="#mt" opacity=".1"/><use href="#mt" mask="url(#ml)"/></g></svg></div>

<div class="bg" id="clouds" aria-hidden="true"></div>
<div class="bg" id="birds" aria-hidden="true"></div>

<svg class="dunes" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true"><path style="fill:color-mix(in srgb,var(--t) 35%,#000)" opacity=".35" d="M0 62C60 30 120 52 200 40S340 22 400 48V120H0Z"/><path style="fill:color-mix(in srgb,var(--t) 20%,#000)" opacity=".55" d="M0 88C80 66 150 94 240 78S360 64 400 84V120H0Z"/></svg>

<canvas id="wxfx" aria-hidden="true"></canvas><div id="wxflash" aria-hidden="true"></div>
<div id="wx" hidden></div>

<main class="app" id="app">
  <header class="top">
    <button class="dbtn" id="hbtn" aria-expanded="false" aria-controls="dpop"><span id="hijri"></span><i class="chev" aria-hidden="true">▾</i></button>
    <div class="cd" id="pbtn" role="button" tabindex="0" aria-expanded="false" aria-controls="ppop"><span id="nx-name"></span><b id="nx-cd">--:--:--</b></div>
    <div class="pop" id="dpop" hidden></div><div class="pop" id="ppop" hidden></div>
  </header>

  <section class="info">
    <span class="why" id="why"></span>
    <h1 class="title" id="title">جاري التحضير</h1>
    <p class="hint" id="hint" aria-live="polite"></p>
  </section>

  <div class="ctl-wrap">
    <audio id="audio" preload="metadata"></audio>
    <div class="ctl">
      <button class="big" id="b-prev" aria-label="السابق"><svg viewBox="0 0 24 24"><path d="M5 5.5v13L16 12z"/><rect x="17.3" y="5.5" width="2.4" height="13" rx="1"/></svg></button>
      <div class="orb">
        <svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="tr" cx="50" cy="50" r="48"/><circle class="pr" id="ring" cx="50" cy="50" r="48"/></svg>
        <span class="halo"></span><span class="halo"></span>
        <button class="play" id="b-play" aria-label="تشغيل أو إيقاف">
          <svg class="i1" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg class="i2" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
        </button>
      </div>
      <button class="big" id="b-next" aria-label="التالي"><svg viewBox="0 0 24 24"><path d="M19 5.5v13L8 12z"/><rect x="4.3" y="5.5" width="2.4" height="13" rx="1"/></svg></button>
    </div>
    <div class="time" id="time">0:00 / 0:00</div>
  </div>

  <nav class="cat" id="cat">
    <button class="on" data-m="now">الآن</button>
    <button data-m="quran">قرآن</button>
    <button data-m="adhkar">أذكار</button>
  </nav>
</main>

<script>
/* ==========================================================================
   ✏️  مكتبتي الصوتية: أضف ملفاتك هنا
   --------------------------------------------------------------------------
   1) ضع ملفات الصوت في مجلد اسمه  audio  بجانب هذا الملف مباشرة.
   2) أضف سطرًا لكل ملف بهذا الشكل:
        { title: 'الاسم الذي يظهر على الشاشة', file: 'audio/اسم-الملف.mp3', type: 'النوع' },

   الأنواع (type):
     'quran'      تلاوة أو سورة         ← تظهر في زر "قرآن" (بنفس ترتيبك)
     'adhkar'     أذكار وأدعية عامة     ← تظهر في زر "أذكار"

let lat=28.11,lng=30.75,T,Tday=-1;
const R=Math.PI/180,sn=a=>Math.sin(a*R),cs=a=>Math.cos(a*R);
function calcTimes(d){
  const tz=-d.getTimezoneOffset()/60,mid=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const D=(mid.getTime()+432e5)/864e5+2440587.5-2451545;
  const g=(357.529+.98560028*D)%360,q=(280.459+.98564736*D)%360;
  const L=q+1.915*sn(g)+.02*sn(2*g),e=23.439-3.6e-7*D,dec=Math.asin(sn(e)*sn(L))/R;
  const ra=((Math.atan2(cs(e)*sn(L),cs(L))/R/15)+24)%24;
  const noon=12+tz-lng/15-((((q/15-ra)+12)%24+24)%24-12);
  const A=a=>Math.acos((-sn(a)-sn(lat)*sn(dec))/(cs(lat)*cs(dec)))/R/15;
  const asrA=-Math.atan(1/(1+Math.tan(Math.abs(lat-dec)*R)))/R,at=h=>new Date(mid.getTime()+h*36e5);
  return {fajr:at(noon-A(19.5)),sunrise:at(noon-A(.833)),dhuhr:at(noon+.017),asr:at(noon+A(asrA)),maghrib:at(noon+A(.833)),isha:at(noon+A(17.5))};
}

let _hd=0;

function hijriMD(n){try{const p=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'numeric'}).formatToParts(n);return[+p.find(x=>x.type==='month').value,+p.find(x=>x.type==='day').value]}catch(e){return[0,0]}}
function occasions(n){const[m,d]=hijriMD(n),w=n.getDay(),o=[];
  if(m===1&&(d===9||d===10))o.push('تاسوعاء وعاشوراء — يُستحب الصيام');
  if(m===9)o.push(d>=21?'العشر الأواخر من رمضان':'شهر رمضان المبارك');
  if(m===10&&d===1)o.push('عيد الفطر المبارك');

  if(d>=13&&d<=15&&m!==9&&m!==12)o.push('الأيام البيض — يُستحب صيامها');
  if(w===1||w===4)o.push((w===1?'الاثنين':'الخميس')+' — يُستحب صيامه');

function setQ(){if(!$('qa'))return;const r=Math.PI/180,f1=lat*r,f2=21.4225*r,dl=(39.8262-lng)*r,

const SYN=29.530588;let _mk='';
function hijriDay(d){try{const f=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{day:'numeric'});if(/islamic/.test(f.resolvedOptions().calendar))return +f.format(d)}catch(e){}return 0}
function moonAge(n){const f=(n.getHours()*3600+n.getMinutes()*60+n.getSeconds())/86400,h=hijriDay(n);
  return h?h+.25+f:((n/864e5+2440587.5-2451550.1)%SYN+SYN)%SYN}
function updateMoon(n){
  const p=(moonAge(n)%SYN)/SYN,c=Math.cos(2*Math.PI*p),rx=47*Math.abs(c),wax=p<.5,flip=wax===(lat<0);
  const d=`M50 3A47 47 0 0 1 50 97A${rx.toFixed(2)} 47 0 0 ${c>0?0:1} 50 3Z`,k=d+flip;
  if(k===_mk)return;_mk=k;
  const mp=$('mp');mp.setAttribute('d',d);mp.setAttribute('transform',flip?'translate(100 0) scale(-1 1)':'');
  $('mhalo').style.opacity=(.12+.88*(1-c)/2).toFixed(2);
}
/* ===== سحب واقعية: طبقة ظل + جسم + لمعة، مع تشويه عضوي للحواف ===== */
(function(){
  const F=[3,11,27].map((s,i)=>`<filter id="cf${i}" x="-15%" y="-40%" width="130%" height="180%"><feTurbulence type="fractalNoise" baseFrequency=".014 .028" numOctaves="4" seed="${s}" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="44" xChannelSelector="R" yChannelSelector="G"/><feGaussianBlur stdDeviation="1.8"/></filter>`).join('');
  const C=[[220,8,160,-30,.8],[150,17,110,-90,.65],[260,27,210,-150,.6],[170,36,130,-10,.6],[200,44,180,-120,.5],[130,13,95,-60,.6],[190,30,170,-100,.6],[240,6,230,-20,.5],[160,40,120,-140,.55],[210,20,200,-80,.6],[260,34,240,-50,.55],[180,2,150,-110,.5]];
  let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
  const cl=C.map(([w,y,d,dl,o],i)=>{
    const P=[];for(let k=0;k<8;k++){const t=k/7,r=22+34*Math.pow(Math.sin(Math.PI*t),.7)*(.75+.5*rnd());P.push([60+t*280+(rnd()-.5)*14,112-r*.55-rnd()*8,r])}

const ADHAN=([k,nm])=>{
  const f=mine('adhan_fajr'),pool=(k==='fajr'&&f.length)?f.map(x=>mk(x)):lib('adhan'),b=pool[0];
  return {...b,key:'adhan'+k+Tday,title:'حي على الصلاة',why:'دخل وقت صلاة '+nm};
};
const played=new Set(),hist=[];let mode='now',cur=null,errs=0,lastQ='';
try{lastQ=localStorage.getItem('lastQ')||''}catch(e){}
function pick(){
  const n=new Date(),w=windows(n),c=[];
  if(w.adhan)c.push(ADHAN(w.adhan));
  if(w.kahf)c.push(...lib('kahf',WHY.kahf));
  if(w.m)c.push(...lib('morning',WHY.m));
  if(w.e)c.push(...lib('evening',WHY.e));
  const hit=c.find(x=>!played.has(x.key));if(hit)return hit;
  const fav=mine('quran').length?lib('quran',WHY.mix):[67,55,2,36,56,19].map(i=>mk(SURAHS[i-1],WHY.mix));
  const mixed=fav.concat(lib('adhkar',WHY.mix));
  let pool=mixed.filter(x=>!played.has(x.key));
  if(!pool.length){mixed.forEach(x=>played.delete(x.key));pool=mixed}
  return rnd(pool);
}

async function lock(){try{await navigator.wakeLock?.request('screen')}catch(e){}}

function load(m,auto=true,noHist){
  cur=m;played.add(m.key);if(!noHist)hist.push(m);

const adhkarList=()=>lib('morning',WHY.m).concat(lib('evening',WHY.e),lib('adhkar',WHY.a));
function cycle(list,d,fallbackKey){
  let i=list.findIndex(x=>x.key===(cur&&cur.key));

}

  if(mode==='quran')return cycle(lib('quran',WHY.q),d,lastQ);

  mode=m;mark();const w=windows(new Date());
  if(m==='now')load(pick());
  else if(m==='quran'){const Q=lib('quran',WHY.q),i=Q.findIndex(x=>x.key===lastQ);load(w.kahf?lib('kahf',WHY.kahf)[0]:Q[i<0?0:i])}
  else{const L=adhkarList();load(w.m?lib('morning',WHY.m)[0]:w.e?lib('evening',WHY.e)[0]:(lib('adhkar',WHY.a)[0]||L[0]))}
}
$('b-play').onclick=()=>audio.paused?play():(audio.pause(),setState(false,'متوقف مؤقتًا'));
$('b-next').onclick=()=>step(1);
$('b-prev').onclick=()=>step(-1);
$('cat').onclick=e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.m)};
audio.ontimeupdate=()=>{if(!audio.duration)return;ring(audio.currentTime/audio.duration);$('time').textContent=`${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;errs=0};
audio.onended=()=>step(1);
audio.onerror=()=>{setState(false,'تعذر تشغيل الملف، تأكد من اسمه ومساره');if(++errs<3)setTimeout(()=>step(1),2000)};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!audio.paused)lock()});
if('mediaSession' in navigator){const ms=navigator.mediaSession;ms.setActionHandler('play',play);ms.setActionHandler('pause',()=>{audio.pause();setState(false,'متوقف مؤقتًا')});ms.setActionHandler('nexttrack',()=>step(1));ms.setActionHandler('previoustrack',()=>step(-1))}

/* ===== كل ثانية: السماء والعد التنازلي وأذان الوقت ===== */
function tick(){
  const n=new Date();if(n.getDate()!==Tday)recalc();
  const p=phase(n);if(document.body.dataset.p!==p)document.body.dataset.p=p;
  placeSky(n);updateMoon(n);
  let nx=PR.find(([k])=>T[k]>n),nt;nx?nt=T[nx[0]]:(nx=PR[0],nt=new Date(T.fajr.getTime()+864e5));
  const s=Math.max(0,Math.floor((nt-n)/1000)),z=v=>String(v).padStart(2,'0');
  $('nx-name').textContent='باقي على '+nx[1];document.querySelectorAll('#ppop .row').forEach(e=>e.classList.toggle('on',e.dataset.k===nx[0]));
  $('nx-cd').textContent=`${z(Math.floor(s/3600))}:${z(Math.floor(s%3600/60))}:${z(s%60)}`;
  const pv=[...PR].reverse().find(([k])=>T[k]<=n),pt=pv?T[pv[0]]:new Date(T.isha.getTime()-864e5);
  $('pbtn').style.setProperty('--pg',Math.min(1,Math.max(0,(n-pt)/(nt-pt))).toFixed(3));
  const ad=PR.find(([k])=>n-T[k]>=0&&n-T[k]<4000);
  if(ad&&!played.has(ADHAN(ad).key)){mode='now';mark();load(ADHAN(ad))}
}
/* ===== نوافذ التاريخ ومواعيد الصلاة ===== */
(function(){
  const P=[['hbtn','dpop'],['pbtn','ppop']];
  const close=()=>P.forEach(([b,p])=>{$(p).hidden=true;$(b).setAttribute('aria-expanded','false')});
  const tog=(b,p)=>{const o=$(p).hidden;close();if(o){$(p).hidden=false;$(b).setAttribute('aria-expanded','true')}};
  P.forEach(([b,p])=>{$(b).addEventListener('click',e=>{e.stopPropagation();tog(b,p)});
    $(b).addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tog(b,p)}else if(e.key==='Escape')close()})});
  document.addEventListener('click',e=>{if(!e.target.closest('.pop'))close()});
})();
/* ===== الطقس الواقعي: يجلب الحالة الحقيقية (Open-Meteo) ويغيّر السماء والسحب والمطر والرياح ===== */
(function(){
  const NM={0:'صافٍ',1:'صافٍ غالبًا',2:'غائم جزئيًا',3:'غائم',45:'ضباب',48:'ضباب',51:'رذاذ',53:'رذاذ',55:'رذاذ',56:'رذاذ متجمد',57:'رذاذ متجمد',61:'مطر خفيف',63:'مطر',65:'مطر غزير',66:'مطر متجمد',67:'مطر متجمد',71:'ثلج خفيف',73:'ثلج',75:'ثلج كثيف',77:'حبيبات ثلج',80:'زخات مطر',81:'زخات مطر',82:'زخات غزيرة',85:'زخات ثلج',86:'زخات ثلج',95:'عاصفة رعدية',96:'عاصفة رعدية وبَرَد',99:'عاصفة رعدية وبَرَد'};
  const RN={51:.25,53:.35,55:.45,56:.35,57:.5,61:.5,63:.65,65:1,66:.55,67:.9,80:.55,81:.8,82:1,95:.9,96:1,99:1},TH=[0,0,0,15,25,35,45,55,60,70,78,85];
  const FAKE={clear:{code:0,temp:31,cover:0,ws:8},partly:{code:2,temp:29,cover:50,ws:12},cloudy:{code:3,temp:26,cover:95,ws:18},fog:{code:45,temp:19,cover:100,ws:4},rain:{code:63,temp:22,cover:95,ws:22},heavy:{code:65,temp:20,cover:100,ws:35},storm:{code:95,temp:21,cover:100,ws:40},snow:{code:73,temp:-1,cover:100,ws:10}};
  const rs=document.documentElement.style,fx=$('wxfx'),cx=fx.getContext('2d'),still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let P=[],M=null,raf=0,WS=0,lt=0;
  const fit=()=>{fx.width=innerWidth;fx.height=innerHeight};fit();addEventListener('resize',fit);
  function loop(){cx.clearRect(0,0,fx.width,fx.height);if(!M){raf=0;return}
    const sl=Math.min(6,WS/6),W=innerWidth,H=innerHeight;
    if(M==='rain'){cx.strokeStyle='rgba(205,220,240,.5)';cx.lineWidth=1.1;cx.beginPath();
      for(const p of P){const L=10+p.v*14,sp=14+p.v*12;cx.moveTo(p.x,p.y);cx.lineTo(p.x-sl*L*.12,p.y+L);p.y+=sp;p.x-=sl*sp*.12;if(p.y>H){p.y=-20;p.x=Math.random()*(W+100)}if(p.x<-20)p.x=W+20}cx.stroke()}
    else{cx.fillStyle='rgba(255,255,255,.85)';for(const p of P){cx.beginPath();cx.arc(p.x,p.y,1+p.r*2.2,0,6.283);cx.fill();p.y+=.8+p.v*1.6;p.x+=Math.sin((p.y+p.r*50)/40)*.6-sl*.1;if(p.y>H)p.y=-5;if(p.x<-5)p.x=W+5}}
    raf=requestAnimationFrame(loop)}
  function setFx(k,n){M=k;P=Array.from({length:k?n:0},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,v:Math.random(),r:Math.random()}));if(k&&!raf&&!still)loop();if(!k)cx.clearRect(0,0,fx.width,fx.height)}
  const fl=$('wxflash');let lg=0;
  function bolt(){const x=fl;x.style.animation='none';void x.offsetWidth;x.style.animation='flash .9s ease-out';lg=setTimeout(bolt,6000+Math.random()*9000)}
  function apply(w){
    const code=w.code,ws=w.ws||0,S=[71,73,75,77,85,86].includes(code),F=code===45||code===48,ST=code>=95,rain=RN[code]||0;let c=w.cover;
    c=code===0?Math.min(c,10):code===1?Math.min(c,30):code===2?Math.max(30,Math.min(c,65)):code===3?Math.max(c,85):Math.max(c,80);
    const key=ST?'storm':S?'snow':rain?'rain':F?'fog':c>=80?'cloudy':c>=30?'partly':'clear';
    rs.setProperty('--wo',Math.min(.7,Math.max(0,(c-40)/60*.3)+rain*.18+(ST?.12:0)+(S?.12:0)+(F?.12:0)).toFixed(2));
    rs.setProperty('--wf',F?.85:0);rs.setProperty('--cb',Math.max(.45,1-c/100*.2-rain*.25-(ST?.15:0)).toFixed(2));
    rs.setProperty('--wm',Math.min(3,Math.max(.7,.7+ws/15)).toFixed(2));rs.setProperty('--sa',Math.min(5,.5+ws/9).toFixed(1)+'deg');rs.setProperty('--sd',Math.max(1.2,4-ws/10).toFixed(1)+'s');
    window.WXV=Math.max(.05,1-Math.min(.9,c/100*.75+rain*.2+(F?.5:0)+(S?.2:0)));WS=ws;
    document.querySelectorAll('#clouds .cloud').forEach((e,i)=>{let v=Math.min(1,Math.max(0,(c-TH[i])/20));if(i<3)v=Math.max(.3,v);e.style.setProperty('--cc',(v*(1+Math.max(0,c-75)/40)).toFixed(2))});
    setFx(S?'snow':rain?'rain':null,S?110:Math.round(50+rain*170));
    clearTimeout(lg);if(ST&&!still)lg=setTimeout(bolt,2500);
    document.body.dataset.wx=key;const e=$('wx');e.hidden=false;e.innerHTML=(NM[code]||'')+' · <bdi dir="ltr">'+Math.round(w.temp).toLocaleString('ar-EG')+'°</bdi>'+(ws>=30?' · رياح نشطة':'');
    try{placeSky(new Date())}catch(_){}
  }
  async function loadWx(){try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(3)}&longitude=${lng.toFixed(3)}&current=temperature_2m,weather_code,cloud_cover,wind_speed_10m&timezone=auto`),c=(await r.json()).current,w={code:c.weather_code,temp:c.temperature_2m,cover:c.cloud_cover,ws:c.wind_speed_10m};try{localStorage.setItem('wx',JSON.stringify(w))}catch(e){}apply(w)}catch(e){}}
  window.loadWx=loadWx;
  const q=new URLSearchParams(location.search).get('wx');
  if(FAKE[q])apply(FAKE[q]);
  else{try{const w=JSON.parse(localStorage.getItem('wx'));if(w)apply(w)}catch(e){}loadWx();setInterval(loadWx,9e5)}
})();
/* ===== طيور: سربان صغيران يظهران نادرًا ===== */
(function(){
  const W=['M0 0Q-8 -9 -17 -5Q-9 -3 0 2Q9 -3 17 -5Q8 -9 0 0Z','M0 0Q-8 -3 -17 2Q-9 0 0 2Q9 0 17 2Q8 -3 0 0Z','M0 0Q-8 4 -15 10Q-8 5 0 3Q8 5 15 10Q8 4 0 0Z'];
  const V=[0,1,2,1,0].map(i=>W[i]).join(';');
  const flock=(n,y,d,dl,k)=>{let b='';
    for(let i=0;i<n;i++){const z=14+Math.random()*9,x=-i*(16+Math.random()*8),yy=(i%2?1:-1)*Math.ceil(i/2)*(8+Math.random()*6);
      b+=`<svg viewBox="-20 -12 40 26" width="${z.toFixed(0)}" style="left:${x.toFixed(0)}px;top:${yy.toFixed(0)}px;fill:color-mix(in srgb,var(--t) 40%,#10141c)"><path d="${W[0]}"><animate attributeName="d" dur="${(.8+Math.random()*.25).toFixed(2)}s" begin="-${(Math.random()*.8).toFixed(2)}s" repeatCount="indefinite" values="${V}"/></path><circle cx="0" cy="1" r="1.7"/></svg>`}
    return `<div class="flock" style="--y:${y}%;--d:${d}s;--dl:${dl}s;--k:${k}">${b}</div>`};
  $('birds').innerHTML=flock(4,16,110,-95,'fly')+flock(3,30,170,-60,'flyr');
})();
for(let i=0;i<48;i++){const s=document.createElement('i');s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*55}%;animation-delay:-${Math.random()*4}s;transform:scale(${.6+Math.random()*1.1})`;$('stars').appendChild(s)}
recalc();tick();setInterval(tick,1000);load(pick());
if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{lat=p.coords.latitude;lng=p.coords.longitude;recalc();tick();window.loadWx&&loadWx()},()=>{},{timeout:6000,maximumAge:36e5});
</script>
